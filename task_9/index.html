<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Задание 9</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #111111;
        }

        /* =========================
           ОСНОВНОЙ КОНТЕЙНЕР
        ========================= */

        .page {
            max-width: 1920px;
            margin: 0 auto;
            padding: 48px 64px 80px;
        }

        /* =========================
           КНОПКА НАЗАД
        ========================= */

        .back {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            text-decoration: none;
            color: #777777;

            font-size: 24px;
            font-weight: 500;

            margin-bottom: 56px;

            transition: color 0.2s ease;
        }

        .back:hover {
            color: #246BEB;
        }

        .back-arrow {
            font-size: 30px;
            line-height: 1;
        }

        /* =========================
           ЗАГОЛОВОК
        ========================= */

        .header {
            margin-bottom: 64px;
        }

        .header h1 {
            margin: 0 0 18px;

            font-size: 64px;
            line-height: 1.05;
            font-weight: 800;

            letter-spacing: -1.5px;
            color: #111111;
        }

        .header p {
            margin: 0;

            font-size: 30px;
            line-height: 1.3;
            font-weight: 400;

            color: #777777;
        }

        /* =========================
           КАРТОЧКИ
        ========================= */

        .cards {
            display: grid;

            grid-template-columns: repeat(2, minmax(0, 1fr));

            gap: 36px;
        }

        .card {
            position: relative;

            display: flex;
            flex-direction: column;

            min-height: 370px;

            padding: 52px;

            background: #ffffff;

            border: 2px solid #e3e3e3;
            border-radius: 32px;

            text-decoration: none;
            color: #111111;

            overflow: hidden;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);

            border-color: #246BEB;

            box-shadow: 0 12px 30px rgba(36, 107, 235, 0.10);
        }

        /* =========================
           СИНЯЯ ПОЛОСА
        ========================= */

        .card::before {
            content: "";

            position: absolute;

            left: 0;
            top: 48px;
            bottom: 48px;

            width: 7px;

            background: #246BEB;

            border-radius: 0 5px 5px 0;
        }

        /* =========================
           НОМЕР ДЗ
        ========================= */

        .card-label {
            display: inline-flex;
            align-items: center;

            width: fit-content;

            margin-left: 2px;
            margin-bottom: 28px;

            padding: 8px 14px;

            background: #f1f5ff;

            color: #246BEB;

            font-size: 22px;
            line-height: 1;
            font-weight: 800;

            border-radius: 4px;

            text-transform: uppercase;
        }

        /* =========================
           ЗАГОЛОВОК КАРТОЧКИ
        ========================= */

        .card-title {
            margin: 0 0 22px;

            max-width: 850px;

            font-size: 42px;
            line-height: 1.12;
            font-weight: 800;

            letter-spacing: -0.8px;

            color: #111111;
        }

        /* =========================
           ОПИСАНИЕ
        ========================= */

        .card-description {
            margin: 0;

            max-width: 850px;

            font-size: 25px;
            line-height: 1.45;
            font-weight: 400;

            color: #777777;
        }

        /* =========================
           ОРАНЖЕВЫЙ АКЦЕНТ
        ========================= */

        .card-accent {
            margin-top: auto;
            padding-top: 35px;

            color: #F15A24;

            font-size: 20px;
            font-weight: 700;
        }

        .card-accent span {
            display: inline-block;

            transition: transform 0.2s ease;
        }

        .card:hover .card-accent span {
            transform: translateX(6px);
        }

        /* =========================
           МОБИЛЬНАЯ ВЕРСИЯ
        ========================= */

        @media (max-width: 1000px) {

            .page {
                padding: 32px 28px 60px;
            }

            .back {
                font-size: 20px;
                margin-bottom: 42px;
            }

            .header {
                margin-bottom: 44px;
            }

            .header h1 {
                font-size: 48px;
            }

            .header p {
                font-size: 24px;
            }

            .cards {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .card {
                min-height: 320px;
                padding: 40px;
                border-radius: 26px;
            }

            .card::before {
                top: 36px;
                bottom: 36px;
            }

            .card-title {
                font-size: 34px;
            }

            .card-description {
                font-size: 22px;
            }
        }

        @media (max-width: 600px) {

            .page {
                padding: 24px 18px 50px;
            }

            .back {
                font-size: 18px;
                margin-bottom: 32px;
            }

            .back-arrow {
                font-size: 24px;
            }

            .header h1 {
                font-size: 38px;
                letter-spacing: -0.8px;
            }

            .header p {
                font-size: 20px;
            }

            .card {
                min-height: 280px;
                padding: 32px 28px;
                border-radius: 22px;
            }

            .card::before {
                top: 28px;
                bottom: 28px;
                width: 5px;
            }

            .card-label {
                font-size: 18px;
                margin-bottom: 20px;
            }

            .card-title {
                font-size: 29px;
                margin-bottom: 16px;
            }

            .card-description {
                font-size: 19px;
            }

            .card-accent {
                font-size: 18px;
                padding-top: 28px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- НАЗАД -->
    <a href="../index.html" class="back">
        <span class="back-arrow">←</span>
        <span>Назад</span>
    </a>


    <!-- ЗАГОЛОВОК -->
    <header class="header">
        <h1>Задание 9</h1>

        <p>
            Выберите домашнее задание
        </p>
    </header>


    <!-- КАРТОЧКИ -->
    <main class="cards">

        <!-- =========================
             ДЗ 9.1
        ========================== -->

        <a href="9_1/index.html" class="card">

            <div class="card-label">
                ДЗ 9.1
            </div>

            <h2 class="card-title">
                Проверяемые и непроверяемые гласные
            </h2>

            <p class="card-description">
                Практика по проверяемым и непроверяемым
                безударным гласным в корне слова.
            </p>

            <div class="card-accent">
                <span>Перейти к заданию →</span>
            </div>

        </a>


        <!-- =========================
             ОБЩЕЕ ДЗ 9
        ========================== -->

        <a href="9/index.html" class="card">

            <div class="card-label">
                ДЗ 9
            </div>

            <h2 class="card-title">
                Общее ДЗ по заданию 9
            </h2>

            <p class="card-description">
                Итоговая домашняя работа
                по всем темам задания 9.
            </p>

            <div class="card-accent">
                <span>Перейти к заданию →</span>
            </div>

        </a>

    </main>

</div>

</body>
</html>
