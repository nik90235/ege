<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Задание 9</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    /* =========================
       ОСНОВНОЙ КОНТЕЙНЕР
    ========================= */

    .page {
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto;
      padding: 42px 0 80px;
    }

    /* =========================
       НАЗАД
    ========================= */

    .back {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 34px;

      color: #777777;
      text-decoration: none;

      font-size: 18px;
      font-weight: 500;

      transition: color 0.2s ease;
    }

    .back:hover {
      color: #2868e8;
    }

    .back-arrow {
      font-size: 26px;
      line-height: 1;
    }

    /* =========================
       ЗАГОЛОВОК
    ========================= */

    .header {
      margin-bottom: 55px;
    }

    .header h1 {
      margin: 0 0 12px;

      font-size: clamp(42px, 5vw, 64px);
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .header p {
      margin: 0;

      color: #777777;

      font-size: 25px;
      line-height: 1.35;
      font-weight: 500;
    }

    /* =========================
       ОРАНЖЕВАЯ ЛИНИЯ
    ========================= */

    .orange-line {
      width: 100%;
      height: 5px;

      margin: 0 0 42px;

      background: #f15a24;
      border-radius: 4px;
    }

    /* =========================
       КАРТОЧКИ
    ========================= */

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    .card {
      position: relative;

      display: block;

      min-height: 310px;
      padding: 38px 40px 42px;

      background: #ffffff;

      border: 1px solid #dddddd;
      border-radius: 22px;

      text-decoration: none;
      color: #111111;

      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);

      border-color: #2868e8;

      box-shadow:
        0 10px 30px rgba(40, 104, 232, 0.10);
    }

    /* синяя полоска слева */

    .card::before {
      content: "";

      position: absolute;

      left: 0;
      top: 38px;
      bottom: 38px;

      width: 5px;

      background: #2868e8;

      border-radius: 0 5px 5px 0;
    }

    /* =========================
       ТЕГ
    ========================= */

    .card-tag {
      display: inline-block;

      margin-bottom: 25px;
      padding: 7px 13px;

      background: #f15a24;
      color: #ffffff;

      border-radius: 7px;

      font-size: 15px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    /* =========================
       НАЗВАНИЕ
    ========================= */

    .card-title {
      margin: 0 0 18px;

      font-size: clamp(28px, 3vw, 38px);
      line-height: 1.12;

      font-weight: 800;
      letter-spacing: -0.5px;
    }

    /* =========================
       ОПИСАНИЕ
    ========================= */

    .card-description {
      margin: 0;

      color: #707070;

      font-size: 19px;
      line-height: 1.5;

      font-weight: 500;
    }

    /* =========================
       СТРЕЛКА
    ========================= */

    .card-arrow {
      position: absolute;

      right: 35px;
      bottom: 30px;

      color: #2868e8;

      font-size: 30px;
      font-weight: 500;

      opacity: 0;

      transform: translateX(-5px);

      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
    }

    .card:hover .card-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* =========================
       МОБИЛЬНАЯ ВЕРСИЯ
    ========================= */

    @media (max-width: 800px) {

      .page {
        width: min(100% - 30px, 650px);
        padding-top: 28px;
      }

      .header {
        margin-bottom: 38px;
      }

      .header h1 {
        font-size: 42px;
      }

      .header p {
        font-size: 20px;
      }

      .orange-line {
        margin-bottom: 28px;
      }

      .cards {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .card {
        min-height: 260px;
        padding: 30px 30px 35px;
      }

      .card::before {
        top: 30px;
        bottom: 30px;
      }

      .card-title {
        font-size: 29px;
      }

      .card-description {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- НАЗАД -->
    <a href="../index.html" class="back">
      <span class="back-arrow">←</span>
      <span>Назад</span>
    </a>


    <!-- ЗАГОЛОВОК -->
    <header class="header">

      <h1>Задание 9</h1>

      <p>Выберите домашнее задание</p>

    </header>


    <!-- ОРАНЖЕВАЯ ЛИНИЯ -->
    <div class="orange-line"></div>


    <!-- КАРТОЧКИ -->
    <section class="cards">


      <!-- =========================
           ДЗ 9.1
      ========================== -->

      <a href="9_1/index.html" class="card">

        <div class="card-tag">
          ДЗ 9.1
        </div>

        <h2 class="card-title">
          Проверяемые и<br>
          непроверяемые гласные
        </h2>

        <p class="card-description">
          Практика по проверяемым и непроверяемым
          безударным гласным в корне слова.
        </p>

        <div class="card-arrow">
          →
        </div>

      </a>


      <!-- =========================
           ОБЩЕЕ ДЗ 9
      ========================== -->

      <a href="9/index.html" class="card">

        <div class="card-tag">
          ДЗ 9
        </div>

        <h2 class="card-title">
          Общее ДЗ по заданию 9
        </h2>

        <p class="card-description">
          Итоговая домашняя работа по всем темам
          задания 9.
        </p>

        <div class="card-arrow">
          →
        </div>

      </a>


    </section>

  </main>

</body>
</html>
