<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Задание 9</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #111;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 50px 30px;
        }

        .back {
            display: inline-block;
            margin-bottom: 35px;
            color: #777;
            text-decoration: none;
            font-size: 16px;
        }

        .back:hover {
            color: #111;
        }

        .title {
            font-size: 42px;
            font-weight: 700;
            margin: 0 0 10px;
        }

        .subtitle {
            font-size: 19px;
            color: #777;
            margin: 0 0 40px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .card {
            display: block;
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: #111;
            transition: all 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .number {
            font-size: 15px;
            font-weight: 700;
            color: #777;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .card-text {
            font-size: 17px;
            line-height: 1.5;
            color: #777;
        }

        @media (max-width: 700px) {
            .container {
                padding: 30px 20px;
            }

            .title {
                font-size: 32px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Назад на главную страницу -->
    <a href="../index.html" class="back">
        ← Назад
    </a>

    <h1 class="title">
        Задание 9
    </h1>

    <p class="subtitle">
        Выберите домашнее задание
    </p>

    <div class="cards">

        <!-- ДЗ 9.1 -->
        <a href="9_1/index.html" class="card">

            <div class="number">
                ДЗ 9.1
            </div>

            <div class="card-title">
                Проверяемые и непроверяемые гласные
            </div>

            <div class="card-text">
                Практика по проверяемым и непроверяемым
                безударным гласным в корне слова.
            </div>

        </a>


        <!-- ОБЩЕЕ ДЗ 9 -->
        <a href="9/index.html" class="card">

            <div class="number">
                ДЗ 9
            </div>

            <div class="card-title">
                Общее ДЗ по заданию 9
            </div>

            <div class="card-text">
                Итоговая домашняя работа по всем темам
                задания 9.
            </div>

        </a>

    </div>

</div>

</body>
</html>
