        const dictContent = document.getElementById('dictionaryContent');
        const alphabetNav = document.getElementById('alphabetNav');

        function buildDictionary() {
            dictContent.innerHTML = '';
            alphabetNav.innerHTML = '';

            for (let letter in dictData) {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.innerText = letter;
                btn.onclick = () => {
                    const el = document.getElementById(`letter-${letter}`);
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                };
                alphabetNav.appendChild(btn);

                const sec = document.createElement('div');
                sec.className = 'letter-section';
                sec.id = `letter-${letter}`;

                const h2 = document.createElement('h2');
                h2.className = 'section-letter';
                h2.textContent = letter;
                sec.appendChild(h2);

                const list = document.createElement('div');
                list.className = 'words-list';

                dictData[letter].forEach(word => {
                    const item = document.createElement('div');
                    item.className = 'word-item';
                    item.textContent = word;
                    list.appendChild(item);
                });

                sec.appendChild(list);
                dictContent.appendChild(sec);
            }
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            const sections = document.querySelectorAll('.letter-section');

            sections.forEach(section => {
                const items = section.querySelectorAll('.word-item');
                let hasVisibleWords = false;

                items.forEach(item => {
                    if (item.innerText.toLowerCase().includes(query)) {
                        item.style.display = 'block';
                        hasVisibleWords = true;
                    } else {
                        item.style.display = 'none';
                    }
                });

                section.style.display = hasVisibleWords ? 'block' : 'none';
            });
        });

        buildDictionary();
        localStorage.setItem('vocabulary_dict_completed', new Date().toLocaleDateString('ru-RU'));
